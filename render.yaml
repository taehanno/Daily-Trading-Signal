# Render 배포 설정 — 백그라운드 워커(24시간 상시 실행)
# https://render.com → New → Blueprint → 이 repo 선택
services:
  - type: worker
    name: daily-trading-signal
    runtime: python
    plan: starter            # free 플랜은 worker 미지원 → starter 사용
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false          # 대시보드에서 직접 입력(민감정보)
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CANDLE_INTERVAL
        value: "24h"
      - key: CHECK_INTERVAL_MIN
        value: "60"
      - key: TOP_N
        value: "20"
      - key: DAILY_SUMMARY_HOUR
        value: "9"
      - key: ALERT_MODE
        value: "on_change"
      # 특정 코인만 보려면 주석 해제 (예: BTC,ETH,XRP,SOL)
      # - key: COINS
      #   value: "BTC,ETH,XRP,SOL,DOGE"
