name: trading-signal

# 일봉 스윙: 하루 1회 분석이면 충분(확정 일봉은 하루 한 번만 바뀜).
# 스케줄은 외부 트리거(cron-job.org)가 workflow_dispatch 로 호출한다.
# → cron-job.org 를 매일 1회(예: 09:00 KST = "0 0 * * *" UTC)로 설정 권장.
#   (자주 호출해도 페이퍼 로직이 멱등이라 중복은 없지만 Actions 분/API 낭비.)
# → 페이퍼 일일요약(PAPER_SUMMARY_HOUR=9, KST)을 받으려면 09시대 실행이 1회는 있어야 함.
# → GitHub 자체 schedule 이벤트(지연/누락 잦음) 대신 외부 트리거 사용.
on:
  workflow_dispatch:            # 외부 트리거(cron-job.org) + 수동 실행 버튼
    inputs:
      test_alert:
        description: "합성 알림으로 텔레그램 발송 테스트(시장 무관 1건 강제 발송)"
        type: boolean
        default: false
      force_summary:
        description: "페이퍼 일일요약을 시각 무관 즉시 강제 발송(수동 검증용)"
        type: boolean
        default: false
  # schedule:                   # (비활성) GitHub 네이티브 크론 — 5분 간격은 지연이 커서 비권장
  #   - cron: "*/5 * * * *"

# state.json 커밋백을 위해 쓰기 권한 필요 (on_change 스팸 방지용 상태 유지)
permissions:
  contents: write

concurrency:
  group: trading-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run signal (oneshot)
        if: ${{ github.event.inputs.test_alert != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESHOT: "true"
          CANDLE_INTERVAL: "24h"     # 일봉 스윙: 돈치안 돌파 + 거래량 급증
          TOP_N: "20"                # 24H 거래대금 상위 20개
          PAPER_TRADING: "true"      # 정보용 가상매매 기록(실시간 포워드테스트) — 실돈 X
          HOURLY_STATUS: "false"     # 단건 이벤트 기반(페이퍼 진입/청산)
          ALERT_MODE: "on_change"
          DAILY_SUMMARY_HOUR: "-1"   # 별도 일일 요약 끔(페이퍼 요약은 PAPER_SUMMARY_HOUR 사용)
          PAPER_SUMMARY_FORCE: ${{ github.event.inputs.force_summary }}  # true면 즉시 강제 발송
          # ALERT_ON_WATCH: "true"   # '돌파 임박(관찰)'까지 받으려면 주석 해제
        run: python main.py

      - name: Telegram 발송 테스트 (수동 test_alert=true 일 때만)
        if: ${{ github.event.inputs.test_alert == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/test_alert.py

      - name: Persist state (on_change 유지)
        # state.json 은 .gitignore 대상이라 -f 로 강제 스테이징 후 staged diff 로 변경 판정
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update signal state [skip ci]"
            git push
          else
            echo "state 변화 없음 — 커밋 생략"
          fi
