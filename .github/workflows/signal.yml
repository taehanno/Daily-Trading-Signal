name: trading-signal

# 무료 배포 옵션: GitHub Actions 크론으로 매시간 1회 분석 실행.
# Render worker(유료) 대신 사용 가능. (스케줄은 UTC 기준, 약간의 지연 있을 수 있음)
on:
  schedule:
    - cron: "5 * * * *"        # 매시 5분 (UTC) — 시간당 1회
  workflow_dispatch: {}         # 수동 실행 버튼

# state.json 커밋백을 위해 쓰기 권한 필요 (on_change 스팸 방지용 상태 유지)
permissions:
  contents: write

concurrency:
  group: trading-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run signal (oneshot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESHOT: "true"
          CANDLE_INTERVAL: "1h"
          TOP_N: "15"
          DAILY_SUMMARY_HOUR: "9"
          ALERT_MODE: "on_change"
        run: python main.py

      - name: Persist state (on_change 유지)
        # state.json 은 .gitignore 대상이라 -f 로 강제 스테이징 후 staged diff 로 변경 판정
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update signal state [skip ci]"
            git push
          else
            echo "state 변화 없음 — 커밋 생략"
          fi
