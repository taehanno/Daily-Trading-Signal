name: trading-signal

# 무료 배포 옵션: 매시간 1회 분석 실행.
# 스케줄은 외부 트리거(cron-job.org)가 매시 정각(KST)에 workflow_dispatch 로 호출한다.
# → GitHub 자체 schedule 이벤트(지연/누락 잦음) 대신 사용. 둘 다 켜면 중복 발송되므로 schedule 은 끔.
on:
  workflow_dispatch: {}         # 외부 트리거(cron-job.org) + 수동 실행 버튼
  # schedule:                   # (비활성) GitHub 네이티브 크론 — 필요시 백업용으로만 사용
  #   - cron: "5 * * * *"

# state.json 커밋백을 위해 쓰기 권한 필요 (on_change 스팸 방지용 상태 유지)
permissions:
  contents: write

concurrency:
  group: trading-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run signal (oneshot)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONESHOT: "true"
          CANDLE_INTERVAL: "24h"     # 일봉 EMA(5/20/60) 정배열 전략
          TOP_N: "20"
          HOURLY_STATUS: "true"      # 매시간 전 종목 현황 1건 발송(변화 없어도 "동일"로 표기)
          DAILY_SUMMARY_HOUR: "-1"   # 매시간 현황이 전체를 커버하므로 별도 9시 요약은 끔(-1)
          ALERT_MODE: "on_change"    # HOURLY_STATUS=true면 단건 알림은 비활성(다이제스트로 일원화)
          # ALERT_ON_WATCH: "true"   # 전조(관찰) 시그널까지 받으려면 주석 해제
        run: python main.py

      - name: Persist state (on_change 유지)
        # state.json 은 .gitignore 대상이라 -f 로 강제 스테이징 후 staged diff 로 변경 판정
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update signal state [skip ci]"
            git push
          else
            echo "state 변화 없음 — 커밋 생략"
          fi
